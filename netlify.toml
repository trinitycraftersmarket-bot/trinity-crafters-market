[build]
command = "npm run build"
publish = "public"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[functions]
node_bundler = "esbuild"
[functions.maintenance]
schedule = "0 * * * *"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
[[redirects]]
from = "/market-dates"
to = "/v2/"
status = 302
force = true
[[redirects]]
from = "/market-dates/"
to = "/v2/"
status = 302
force = true
[[redirects]]
from = "/vendor-opportunities-1"
to = "/v2/#vapply"
status = 302
force = true
[[redirects]]
from = "/vendor-opportunities-1/"
to = "/v2/#vapply"
status = 302
force = true
[[redirects]]
from = "/about-lutz-market"
to = "/v2/"
status = 302
force = true
[[redirects]]
from = "/about-lutz-market/"
to = "/v2/"
status = 302
force = true
[[redirects]]
from = "/food-trucks"
to = "/v2/#vtrucks"
status = 302
force = true
[[redirects]]
from = "/food-trucks/"
to = "/v2/#vtrucks"
status = 302
force = true
[[redirects]]
from = "/"
to = "/v2/"
status = 302
force = true
[[redirects]]
from = "/classic"
to = "/classic/index.html"
status = 200
force = true
[[redirects]]
from = "/classic/"
to = "/classic/index.html"
status = 200
force = true
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
