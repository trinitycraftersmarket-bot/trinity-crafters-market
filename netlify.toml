[build]
command = "npm run build"
publish = "public"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[functions]
node_bundler = "esbuild"
[functions.maintenance]
schedule = "@hourly"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
